<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ask AI - Prep4Placements</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .header {
            background: #071a52;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back {
            font-size: 25px;
            cursor: pointer;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .title {
            color: #071a52;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            font-size: 18px;
            line-height: 1.5;
        }

        .answer {
            font-size: 17px;
            font-weight: bold;
            color: #16803c;
        }

        .explanation {
            line-height: 1.6;
            font-size: 16px;
        }

        .ai-text {
            line-height: 1.6;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            display: block;
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .copy-button {
            background: #16803c;
        }

        .chatgpt-button {
            background: #071a52;
        }

        button:hover {
            opacity: 0.92;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            color: #16803c;
            font-weight: bold;
            display: none;
        }

    </style>

</head>


<body>


    <div class="header">

        <div class="back" onclick="goBack()">←</div>

        <h2>🤖 Ask AI</h2>

    </div>



    <div class="container">


        <!-- CURRENT QUESTION -->

        <div class="card">

            <div class="title">
                Current Question
            </div>

            <div class="question" id="question">
                Loading...
            </div>

        </div>



        <!-- CORRECT ANSWER -->

        <div class="card">

            <div class="title">
                Correct Answer
            </div>

            <div class="answer" id="answer">
                Loading...
            </div>

        </div>



        <!-- EXPLANATION -->

        <div class="card">

            <div class="title">
                Explanation
            </div>

            <div class="explanation" id="explanation">
                Loading...
            </div>

        </div>



        <!-- ASK AI -->

        <div class="card">

            <div class="title">
                Need More Help? 🤖
            </div>

            <div class="ai-text">

                Copy the question and open ChatGPT.
                Paste the question there and ask your doubt.

            </div>


            <button
                class="copy-button"
                onclick="copyQuestion()">

                📋 Copy Question

            </button>


            <button
                class="chatgpt-button"
                onclick="openChatGPT()">

                🤖 Open ChatGPT

            </button>


            <div
                class="message"
                id="copyMessage">

                ✅ Question copied!

            </div>

        </div>


    </div>



    <script>


        // Get question information

        const params =
            new URLSearchParams(window.location.search);


        const question =
            params.get("question") ||
            "Question not available.";


        const answer =
            params.get("answer") ||
            "Answer not available.";


        const explanation =
            params.get("explanation") ||
            "Explanation not available.";



        // Display information

        document.getElementById("question")
            .textContent = question;


        document.getElementById("answer")
            .textContent = answer;


        document.getElementById("explanation")
            .textContent = explanation;



        // Copy question

        function copyQuestion() {


            const textToCopy =
                "I am practicing this question in Prep4Placements.\n\n" +

                "Question: " +
                question +
                "\n\n" +

                "Correct Answer: " +
                answer +
                "\n\n" +

                "Basic Explanation: " +
                explanation +
                "\n\n" +

                "Please explain this question in simple language.";

            

            navigator.clipboard.writeText(textToCopy)
                .then(function() {


                    const message =
                        document.getElementById("copyMessage");


                    message.style.display = "block";


                    setTimeout(function() {

                        message.style.display = "none";

                    }, 2500);


                })
                .catch(function() {


                    alert(
                        "Please copy the question manually."
                    );


                });

        }



        // Open ChatGPT

        function openChatGPT() {

            window.open(
                "https://chatgpt.com/",
                "_blank"
            );

        }



        // Back button

        function goBack() {

            window.history.back();

        }


    </script>


</body>

</html>
